<body>
    <h1>Sobre Iframe | HTML</h1>
    <p>Iframe significa <strong> inline frame</strong>.</p>
    <p>Ele permite que você <em> incorpore</em> outra página/documento dentro da sua própria página HTML.</p>

    <hr>

    <h2> Criando um iframe básico</h2>
    <iframe src="03-listas.html" frameborder="0" width="500" height="600"></iframe>

<hr>
<h2>Explorando outras formas de trabalhar com o iframe </h2>
<h3>Incorpando o YouTube</h3>
<iframe width="560" height="315" 
src="https://
www.
youtube.com/embed/ML5NbVeJuLA?
si=CgRmaoV-1w3-MSHU&amp;start=3" 
title="YouTube video player" frameborder="0" 
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; 
picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"
 allowfullscreen></iframe>

<h3>Incorpando um mapa no site</h3>
